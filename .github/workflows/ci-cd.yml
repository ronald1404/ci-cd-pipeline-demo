name: CI/CD

# CI roda em todo push e PR; o push da imagem só acontece na branch main (ver o job build-push).
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancela execuções antigas da mesma ref quando chega um commit novo (economiza runner).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ github.repository }}   # ex.: usuario/ci-cd-pipeline-demo
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Qualidade: lint estático. É o portão mais barato e rápido — falha primeiro.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  # ---------------------------------------------------------------------------
  # Testes unitários. Independente do lint, mas ambos precisam passar para buildar.
  # ---------------------------------------------------------------------------
  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # ---------------------------------------------------------------------------
  # Build da imagem + push para o GHCR. Só depois de lint e test passarem (needs),
  # e só publica em push na main (não em PR) — PRs validam build sem publicar.
  # ---------------------------------------------------------------------------
  build-push:
    name: Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write           # necessário para o push no ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gera tags automáticas: o SHA do commit (rastreável) e 'latest' na main.
      - name: Metadados da imagem (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (e push só em push na main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
